server:
  port: 8080
  servlet:
    context-path: /api

kanban:
  api:
    prefix: /v1
  upload:
    # 附件物理存储目录（相对进程工作目录，也可用绝对路径）
    dir: ${KANBAN_UPLOAD_DIR:./uploads}
    # 单个工作项附件数量上限，<=0 表示不限制
    max-per-issue: ${KANBAN_UPLOAD_MAX_PER_ISSUE:50}
  dev:
    # 一次性 Excel 导入工具（@Profile("dev")）的数据源路径；留空时该接口拒绝执行
    excel-path: ${KANBAN_DEV_EXCEL_PATH:}

spring:
  main:
    allow-circular-references: true
  application:
    name: kanban-server
  datasource:
    # 凭据一律通过环境变量注入，禁止在配置文件中提交明文密码：
    #   DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD
    url: jdbc:postgresql://${DB_HOST:192.168.2.17}:${DB_PORT:5433}/kanban?reWriteBatchedInserts=true&sslmode=disable
    username: ${DB_USERNAME:postgres}
    # 无默认值：未注入 DB_PASSWORD 时启动即报占位符未解析，避免误用仓库内的弱口令
    password: ${DB_PASSWORD}
    driver: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:192.168.2.17}
      port: ${REDIS_PORT:6379}
      # redis 密码必须通过环境变量 REDIS_PASSWORD 注入（未设置时按无密码连接）
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:15}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # v1.0.0 为固化基线：现有库清空 flyway_schema_history 后，Flyway 会基线到 1.0.0，
    # 跳过 V1.0.0__baseline.sql（避免重复建表）；全新空库则正常执行该脚本初始化。
    baseline-version: 1.0.0
    validate-on-migrate: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  type-handlers-package: com.seven7m.kanban.common.config.handler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:

      id-type: assign_uuid
  mapper-locations: classpath*:mapper/**/*.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
