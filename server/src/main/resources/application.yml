server:
  port: 9085
  servlet:
    context-path: /api

kanban:
  api:
    prefix: /v1
  upload:
    # 附件物理存储目录（相对进程工作目录，也可用绝对路径）
    dir: ${KANBAN_UPLOAD_DIR:./uploads}
    # 单个工作项附件数量上限，<=0 表示不限制
    max-per-issue: ${KANBAN_UPLOAD_MAX_PER_ISSUE:50}
  dev:
    # 一次性 Excel 导入工具（@Profile("dev")）的数据源路径；留空时该接口拒绝执行
    excel-path: ${KANBAN_DEV_EXCEL_PATH:}

spring:
  main:
    allow-circular-references: true
  application:
    name: kanban-server
  datasource:
    # 凭据一律通过环境变量注入，禁止在配置文件中提交明文密码：
    #   DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD
    url: jdbc:postgresql://${DB_HOST:192.168.2.17}:${DB_PORT:5433}/kanban?reWriteBatchedInserts=true&sslmode=disable
    username: ${DB_USERNAME:postgres}
    # 无默认值：未注入 DB_PASSWORD 时启动即报占位符未解析，避免误用仓库内的弱口令
    password: ${DB_PASSWORD}
    driver: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # v1.0.0 为固化基线：现有库清空 flyway_schema_history 后，Flyway 会基线到 1.0.0，
    # 跳过 V1.0.0__baseline.sql（避免重复建表）；全新空库则正常执行该脚本初始化。
    baseline-version: 1.0.0
    validate-on-migrate: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  type-handlers-package: com.seven7m.kanban.common.config.handler
  configuration:
    map-underscore-to-camel-case: true
    # 走 SLF4J 而非 StdOutImpl：后者把每条 SQL 直接打到 stdout，生产环境既有 IO 开销又无法按级别关闭。
    # 本地排查 SQL 时把下面 logging.level 的 mapper 包调成 debug 即可。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:

      id-type: assign_uuid
  mapper-locations: classpath*:mapper/**/*.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
