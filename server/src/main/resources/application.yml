server:
  port: 9085
  servlet:
    context-path: /api

kanban:
  api:
    prefix: /v1
  upload:
    # 附件物理存储目录（相对进程工作目录，也可用绝对路径）
    dir: ${KANBAN_UPLOAD_DIR:./uploads}
    # 单个工作项附件数量上限，<=0 表示不限制
    max-per-issue: ${KANBAN_UPLOAD_MAX_PER_ISSUE:50}
    # 附件/头像的对外访问前缀（不含结尾的 /uploads）。默认取 context-path，
    # 部署在 nginx 的专属前缀下时用 KANBAN_UPLOAD_PUBLIC_PREFIX 覆盖（例如 /kanban-api），
    # 使后端返回给浏览器的地址与它实际发出的前缀一致。
    public-prefix: ${KANBAN_UPLOAD_PUBLIC_PREFIX:${server.servlet.context-path:}}
  # JWT 认证（替代原 HttpSession 方案）
  jwt:
    # 签名密钥：生产务必用环境变量 KANBAN_JWT_SECRET 覆盖，至少 32 字节，泄露即可伪造任意用户
    secret: ${KANBAN_JWT_SECRET:kanban-dev-only-secret-change-in-production-32b}
    # 有效期（分钟）。本方案不支持主动失效，TTL 就是越权窗口，建议 ≤ 120
    expire-minutes: ${KANBAN_JWT_EXPIRE_MINUTES:120}
    issuer: ${KANBAN_JWT_ISSUER:kanban}
  dev:
    # 一次性 Excel 导入工具（@Profile("dev")）的数据源路径；留空时该接口拒绝执行
    excel-path: ${KANBAN_DEV_EXCEL_PATH:}

spring:
  main:
    allow-circular-references: true
  application:
    name: kanban-server
  datasource:
    # 凭据一律通过环境变量注入，禁止在配置文件中提交明文密码：
    #   DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD
    url: jdbc:postgresql://${DB_HOST:192.168.2.17}:${DB_PORT:5433}/kanban?reWriteBatchedInserts=true&sslmode=disable
    username: ${DB_USERNAME:postgres}
    # 无默认值：未注入 DB_PASSWORD 时启动即报占位符未解析，避免误用仓库内的弱口令
    password: ${DB_PASSWORD}
    driver: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # v1.0.0 为固化基线：现有库清空 flyway_schema_history 后，Flyway 会基线到 1.0.0，
    # 跳过 V1.0.0__baseline.sql（避免重复建表）；全新空库则正常执行该脚本初始化。
    baseline-version: 1.0.0
    # 允许"乱序"迁移：历史库的 flyway_schema_history 已推进到 V24~V37（取自 .ai-tmp/old-migrations），
    # 而 V1.0.1/V1.0.2 的版本号数值小于 37。若不开 outOfOrder，新迁移会被判定为"已过去"而不执行，
    # 导致 project_handoff / notification 两张表在既有库上永久缺失（表现为进看板列头 500）。
    out-of-order: true
    # 历史 V24~V37 已从仓库移除（收敛为 v1.0.0 基线），但老库历史表里仍有记录：
    # 只忽略"本地缺失/未来版本"这两类，校验和与新增迁移照常校验，避免把真实错误一并吞掉。
    validate-on-migrate: true
    ignore-migration-patterns:
      - "*:future"
      - "*:missing"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  type-handlers-package: com.seven7m.kanban.common.config.handler
  configuration:
    map-underscore-to-camel-case: true
    # 走 SLF4J 而非 StdOutImpl：后者把每条 SQL 直接打到 stdout，生产环境既有 IO 开销又无法按级别关闭。
    # 本地排查 SQL 时把下面 logging.level 的 mapper 包调成 debug 即可。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:

      id-type: assign_uuid
  mapper-locations: classpath*:mapper/**/*.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
