name: ci

on:
  push:
    branches: ['**']
  pull_request:

# 目标：让"编译 + 单测 + 前端类型检查"成为每次提交的硬门禁。
# 之前项目没有任何 CI，`mvn test` 在 JDK 21 上甚至因为 Mockito 无法自 attach 而静默失败。
jobs:
  backend:
    name: backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven verify (tests + coverage gate)
        run: mvn -B -f server/pom.xml -Pcoverage verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: server/target/site/jacoco
          if-no-files-found: warn

  frontend:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (vue-tsc, noUnusedLocals enabled)
        run: npm run typecheck
      - name: Build
        run: npm run build

  # 阿里 Java 开发手册（p3c）静态检查。
  # 过渡期不阻断构建：pom 里 failOnViolation=false，这里 continue-on-error，
  # 报告作为 artifact 上传。清理完 阿里巴巴规约评估.md 的 P1/P2 后，
  # 把 pom 里的 failOnViolation 改成 true、并去掉这里的 continue-on-error。
  quality:
    name: quality (p3c rules)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run p3c ruleset (ali-*.xml)
        run: mvn -B -f server/pom.xml -Pquality verify -DskipTests
      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: server/target/pmd.xml
          if-no-files-found: warn
