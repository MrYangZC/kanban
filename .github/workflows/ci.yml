name: ci

on:
  push:
    branches: ['**']
  pull_request:

# 目标：让"编译 + 单测 + 前端类型检查"成为每次提交的硬门禁。
# 之前项目没有任何 CI，`mvn test` 在 JDK 21 上甚至因为 Mockito 无法自 attach 而静默失败。
jobs:
  backend:
    name: backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven verify
        run: mvn -B -f server/pom.xml verify

  frontend:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (vue-tsc, noUnusedLocals enabled)
        run: npm run typecheck
      - name: Build
        run: npm run build
