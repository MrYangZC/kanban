        # ===== kanban 研发项目看板（2026-11-26 新增）=====
        # 后端：/home/ubuntu/sda/yushun/kanban/docker-compose.yml 管理的 kanban-server 容器（9085）
        # 前端：/home/ubuntu/sda/yushun/nginx/html/kanban/（vite build --base=/kanban/ 构建）
        #
        # 路径分工：
        #   /kanban/      前端静态资源（history 回退到 /kanban/index.html）
        #   /kanban-api/  后端接口，nginx 摘掉前缀后转给后端 context-path /api
        #                 /kanban-api/v1/projects -> http://…:9085/api/v1/projects
        # 站点根上的 /api 不占用，避免与其他项目冲突。
        #
        # 前缀对齐（后端侧配置，见该目录 docker-compose.yml / .env）：
        #   KANBAN_UPLOAD_PUBLIC_PREFIX=/kanban-api  决定后端返回的头像、附件地址前缀，
        #   以及附件读取用 KB_FILE Cookie 的 Path（= /kanban-api/uploads）。
        #   鉴权走 Authorization: Bearer（JWT），本 location 不覆盖该请求头，默认原样透传。
        #   浏览器渲染 <img src> 无法带请求头，只能靠那个仅作用于 /uploads 的 HttpOnly Cookie 放行。
        #
        # 为什么用 172.17.0.1 而不是容器名：沿用本文件既有约定（/admin-api/、/yushori-prod-api/ 都是
        # 172.17.0.1）。用容器名做 upstream 时，后端容器没启动会导致 nginx 启动即失败。
        location /kanban-api/ {
            proxy_pass http://172.17.0.1:9085/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 附件上传：后端 multipart 单文件 5MB / 单请求 10MB，这里留余量
            client_max_body_size 20m;

            # 导出 CSV / Excel 导入等慢接口，默认 60s 不够
            proxy_connect_timeout 10s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;

            # 后端自己返回 4xx/5xx 时不要把错误页替换掉（前端按 code 判断）
            proxy_intercept_errors off;
        }

        # 前端静态资源 + history 模式回退：/kanban/projects/xxx 这类深链接直接刷新也要能进
        location /kanban/ {
            alias /usr/share/nginx/html/kanban/;
            index index.html index.htm;
            try_files $uri $uri/ /kanban/index.html;

            # ===== 安全响应头 =====
            # CSP 写在这一层而不是后端：后端还要服务 Swagger UI（内联脚本/样式），严格 CSP 会把它打死。
            # 几条取舍：
            #   style-src 'unsafe-inline' —— Element Plus 运行时把样式注入 <style>，去掉就会掉样式；
            #   script-src 'self'         —— vite 产物是外链 module，不需要 inline/eval；
            #   connect-src 'self'        —— 接口与静态资源同源（/kanban-api 是同一个 host）；
            #   img-src 含 data: blob:    —— 头像占位与前端生成的 blob 预览图。
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        }

        # 注意：HSTS 要加在 server 级、且确认整站走 HTTPS 后再加——
        # 一旦下发，浏览器会长期强制该域名走 HTTPS，配错很难回滚。确认后取消注释：
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # /kanban 不带尾斜杠时统一 301，避免相对路径解析错位
        location = /kanban {
            return 301 /kanban/;
        }
        # ===== kanban end =====
